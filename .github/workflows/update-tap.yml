name: Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.2)'
        required: true
        default: '0.2.2'
      sha256:
        description: 'SHA256 of the release DMG'
        required: true
        default: '65a620aa747a55121c4d82cfeab598bfc5f0796c4f402cebed7b91a0c6f906b3'

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update local cask
        run: |
          VERSION="${{ inputs.version }}"
          SHA256="${{ inputs.sha256 }}"
          sed -i \
            -e "s/version \"[^\"]*\"/version \"${VERSION}\"/" \
            -e "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" \
            Casks/heard.rb

      - name: Push cask to Homebrew tap
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          VERSION="${{ inputs.version }}"
          CONTENT=$(base64 -w 0 Casks/heard.rb)
          # Get current file SHA (required by the API to update an existing file)
          FILE_SHA=$(curl -sf \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/execsumo/homebrew-heard/contents/Casks/heard.rb" \
            | jq -r '.sha')
          curl -sf -X PUT \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/execsumo/homebrew-heard/contents/Casks/heard.rb" \
            -d "{\"message\":\"Update heard to v${VERSION}\",\"content\":\"${CONTENT}\",\"sha\":\"${FILE_SHA}\"}"
